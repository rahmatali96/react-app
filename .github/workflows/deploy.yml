
name: Deploy React App

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/react-app:${{ github.sha }} .

      - name: Push Docker Image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/react-app:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull Latest Image from Docker Hub
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/react-app:${{ github.sha }}

      - name: Stop and Remove Existing Container (if exists)
        run: |
          docker stop react-app || true
          docker rm -f react-app || true

      - name: Run New Container
        run: docker run -d -p 5173:80 --name react-app ${{ secrets.DOCKER_USERNAME }}/react-app:${{ github.sha }}

      - name: Remove unused Docker images
        run: docker system prune -af --volumes
