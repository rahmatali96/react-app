
name: Deploy react-app

on: 
  push:
    branches:
      - main
jons:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v3
    
    -name: Login to Docker Hub
      run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }} 

    -name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/react-app
    
    -name: Push Docker Image to docker hub
      run: docker push ${{ secrets.DOCKER_USERNAME }}/react-app:latest
    
  deploy:
    needs: build
    runs-on: aws-ec2
    steps:
      -name: Pull image from Docker Hub
      run: docker pull ${{ secrets.DOCKER_USERNAME }}/react-app:latest

      -name: Delete existing container
       run: docker rm -f react-app || true

      -name: Run new container
       run: docker run -d -p 5173:80 --name react-app ${{ secrets.DOCKER_USERNAME }}/react-app